<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - SIAI School Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #1a202c; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; background: white; border-radius: 12px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #2d3748; margin-bottom: 15px; }
        p { margin: 10px 0; color: #4a5568; }
        .status { font-weight: 700; }
        .error { background: #fed7d7; color: #742a2a; border: 1px solid #feb2b2; padding: 12px 20px; border-radius: 6px; margin-top: 15px; }
        .hidden { display: none !important; }
        .back-btn { display: inline-block; margin-top: 20px; background: #2b6cb0; color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1 data-cy="cancel-title">Payment cancelled</h1>
        <p>You cancelled the payment. Your cart items were not charged.</p>
        <p>Order: <span data-cy="order-id">...</span></p>
        <p>Status: <span class="status" data-cy="order-status">loading</span></p>
        <div class="error hidden" data-cy="page-error"></div>
        <a class="back-btn" href="/" data-cy="back-to-store">Back to store</a>
    </div>

    <script>
        const ORDER_SERVICE_URL = 'http://localhost:3002';
        const NEW_STATUS = 'cancelled';

        const orderId = new URLSearchParams(window.location.search).get('orderId');
        const idEl = document.querySelector('[data-cy="order-id"]');
        const statusEl = document.querySelector('[data-cy="order-status"]');
        const errorEl = document.querySelector('[data-cy="page-error"]');

        function showError(message) {
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }

        async function updateOrder() {
            if (!orderId) {
                statusEl.textContent = 'unknown';
                showError('Missing order ID in the link.');
                return;
            }
            idEl.textContent = orderId;

            try {
                const response = await fetch(`${ORDER_SERVICE_URL}/api/orders/${encodeURIComponent(orderId)}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: NEW_STATUS })
                });
                const data = await response.json();

                if (data.order) {
                    // Show the status the Order Service really stored
                    statusEl.textContent = data.order.status;
                } else {
                    statusEl.textContent = 'unknown';
                }
                if (!data.success) {
                    showError(data.error || 'Could not update the order.');
                }
            } catch (error) {
                statusEl.textContent = 'unknown';
                showError('Could not reach the Order Service.');
            }
        }

        updateOrder();
    </script>
</body>
</html>
