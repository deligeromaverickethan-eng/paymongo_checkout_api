        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; background: #f2f6f3; color: var(--ink); }

        /* Header */
        .site-header { background: var(--green-900); border-bottom: 4px solid var(--gold); }
        .header-inner { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .brand-row { display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 46px; height: 56px; background-color: #fff; border-radius: 10px; padding: 4px; background-image: var(--card-logo); background-repeat: no-repeat; background-position: center; background-size: contain; background-origin: content-box; }
        .brand-title { color: #fff; font-size: 18px; font-weight: 700; line-height: 1.2; }
        .brand-tag { color: rgba(255, 255, 255, 0.72); font-size: 12px; letter-spacing: 0.04em; }
        .auth-bar { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #fff; }
        .auth-link { color: #fff; text-decoration: none; font-weight: 600; padding: 7px 16px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.6); background: transparent; cursor: pointer; font-size: 14px; transition: background 0.15s; }
        .auth-link:hover { background: rgba(255, 255, 255, 0.14); }
        .auth-link.primary { background: var(--gold); border-color: var(--gold); color: #1d2b12; }
        .auth-link.primary:hover { filter: brightness(1.05); background: var(--gold); }

        /* Hero banner */
        .hero { position: relative; overflow: hidden; color: #fff; background: radial-gradient(circle at 12% 0%, rgba(242, 183, 5, 0.2), transparent 40%), linear-gradient(120deg, #0a5c3a 0%, #0b6a45 50%, #0b4f8f 100%); }
        .hero-watermark { position: absolute; right: 4%; top: 50%; width: 260px; height: 320px; transform: translateY(-50%); background-image: var(--watermark); background-repeat: no-repeat; background-position: center; background-size: contain; opacity: 0.16; pointer-events: none; }
        .hero-inner { position: relative; max-width: 1200px; margin: 0 auto; padding: 36px 20px 40px; }
        h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 6px; }
        .subtitle { color: rgba(255, 255, 255, 0.85); font-size: 16px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 26px 20px 10px; }

        /* Products */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .product-card { background: #fff; border-radius: 14px; padding: 20px; border: 1px solid var(--line); border-top: 4px solid var(--green-600); box-shadow: 0 2px 10px rgba(15, 42, 29, 0.06); transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(15, 42, 29, 0.14); }
        .product-thumb { width: 56px; height: 56px; border-radius: 12px; background: linear-gradient(135deg, #e6f4ec, #e3eefb); display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 12px; }
        .product-name { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .product-price { color: var(--green-700); font-size: 22px; font-weight: 800; margin: 6px 0; }
        .product-description { color: var(--muted); font-size: 14px; margin-bottom: 10px; min-height: 40px; }
        .quantity-control { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
        .quantity-control button { background: #edf2f7; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; transition: background 0.15s; }
        .quantity-control button:hover { background: #d9e6dd; }
        .quantity-control span { font-size: 16px; font-weight: 700; width: 30px; text-align: center; }
        .add-btn { background: var(--green-700); color: #fff; border: none; padding: 11px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 14px; font-weight: 600; transition: background 0.2s; }
        .add-btn:hover { background: var(--green-600); }
        .add-btn:disabled { background: #a0aec0; cursor: not-allowed; }

        /* Cart */
        .cart-section { background: #fff; border-radius: 14px; padding: 24px; border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(15, 42, 29, 0.06); margin-bottom: 20px; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .cart-header h2 { font-size: 20px; color: var(--ink); }
        .badge { background: var(--blue-700); color: #fff; border-radius: 50%; padding: 2px 8px; font-size: 12px; margin-left: 5px; }
        .clear-cart-btn { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; margin-left: 8px; }
        .clear-cart-btn:hover { background: #fed7d7; }
        .cart-items { margin: 15px 0; }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
        .cart-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; padding-top: 15px; border-top: 2px solid var(--line); }
        .cart-total span:last-child { color: var(--green-700); }
        .checkout-btn { background: linear-gradient(180deg, #0d8a52, var(--green-700)); color: #fff; border: none; padding: 13px 30px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 15px; box-shadow: 0 4px 12px rgba(10, 92, 58, 0.3); transition: filter 0.15s, box-shadow 0.15s; }
        .checkout-btn:hover { filter: brightness(1.08); box-shadow: 0 6px 16px rgba(10, 92, 58, 0.4); }
        .checkout-btn:disabled { background: #a0aec0; box-shadow: none; cursor: not-allowed; filter: none; }

        /* Messages */
        .alert { padding: 12px 20px; border-radius: 10px; margin-bottom: 15px; font-size: 14px; }
        .alert-success { background: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
        .alert-error { background: #fed7d7; color: #742a2a; border: 1px solid #feb2b2; }
        .loader { display: inline-block; border: 3px solid #f3f3f3; border-top: 3px solid var(--blue-700); border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }

        .site-footer { text-align: center; color: var(--muted); font-size: 12px; padding: 18px 20px 28px; }
        @media (max-width: 600px) { h1 { font-size: 26px; } .hero-watermark { opacity: 0.1; width: 180px; height: 220px; } }
    </style>
</head>
<body>
    <header class="site-header" data-cy="site-header">
        <div class="header-inner">
            <div class="brand-row">
                <div class="header-logo" role="img" aria-label="Holy Name University logo" data-cy="header-logo"></div>
                <div>
                    <div class="brand-title">SIAI School Store</div>
                    <div class="brand-tag">Holy Name University &middot; Witness to the Word</div>
                </div>
            </div>
            <div class="auth-bar" id="authBar" data-cy="auth-bar"></div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-watermark" aria-hidden="true"></div>
        <div class="hero-inner">
            <h1>SIAI School Store</h1>
            <p class="subtitle">School merch and canteen pre-orders</p>
        </div>
    </section>

    <div class="container">
        <div id="alertContainer"></div>

        <div class="products-grid" id="productsGrid"></div>

        <div class="cart-section">
            <div class="cart-header">
                <h2>🛒 Your Cart</h2>
                <div>
                    <span id="cartCount" data-cy="cart-count">0 items</span>
                    <button class="clear-cart-btn" data-cy="clear-cart" onclick="clearCart()">Clear</button>
                </div>
            </div>
            <div id="cartItems" class="cart-items" data-cy="cart-items">
                <p style="color: #a0aec0;">Cart is empty</p>
            </div>
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal" data-cy="cart-total">₱0.00</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn" data-cy="checkout-button" onclick="checkout()">
                Proceed to Checkout
            </button>
        </div>
    </div>

    <footer class="site-footer">&copy; 2026 Holy Name University &middot; SIAI School Store</footer>

    <script>
        // Configuration
        const ORDER_SERVICE_URL = 'http://localhost:3002';
        const PRODUCT_SERVICE_URL = 'http://localhost:3001';

        let products = [];
        let cart = [];
        let isProcessing = false;

        // DOM Elements
        const productsGrid = document.getElementById('productsGrid');
        const cartItems = document.getElementById('cartItems');
        const cartTotal = document.getElementById('cartTotal');
        const cartCount = document.getElementById('cartCount');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const alertContainer = document.getElementById('alertContainer');

        // Load products
        async function loadProducts() {
            try {
                const response = await fetch(`${PRODUCT_SERVICE_URL}/api/products`);
                const data = await response.json();
                if (data.success) {
                    products = data.products;
                    renderProducts();
                }
            } catch (error) {
                showAlert('Failed to load products', 'error');
                console.error('Error loading products:', error);
            }
        }

        // Render products
        function productIcon(name) {
            const n = name.toLowerCase();
            if (n.includes('shirt')) return '\u{1F455}';
            if (n.includes('hoodie')) return '\u{1F9E5}';
            if (n.includes('cap')) return '\u{1F9E2}';
            if (n.includes('notebook')) return '\u{1F4D3}';
            if (n.includes('voucher') || n.includes('meal')) return '\u{1F37D}\u{FE0F}';
            return '\u{1F6CD}\u{FE0F}';
        }

        function renderProducts() {
            productsGrid.innerHTML = products.map(product => `
                <div class="product-card" data-cy="product-card">
                    <div class="product-thumb" aria-hidden="true">${productIcon(product.name)}</div>
                    <div class="product-name" data-cy="product-name">${product.name}</div>
                    <div class="product-price" data-cy="product-price">₱${(product.price / 100).toFixed(2)}</div>
                    <div class="product-description">${product.description}</div>
                    <div class="quantity-control">
                        <button data-cy="qty-minus" onclick="updateQuantity('${product.id}', -1)">−</button>
                        <span id="qty_${product.id}" data-cy="qty">0</span>
                        <button data-cy="qty-plus" onclick="updateQuantity('${product.id}', 1)">+</button>
                    </div>
                    <button class="add-btn" data-cy="add-to-cart" onclick="addToCart('${product.id}')">
                        Add to Cart
                    </button>
                </div>
            `).join('');
        }

        // Update quantity display
        function updateQuantity(productId, delta) {
            const input = document.getElementById(`qty_${productId}`);
            let current = parseInt(input.textContent) || 0;
            current = Math.max(0, current + delta);
            input.textContent = current;
        }

        // Add to cart
        function addToCart(productId) {
            const qtyInput = document.getElementById(`qty_${productId}`);
            const quantity = parseInt(qtyInput.textContent) || 0;

            if (quantity === 0) {
                showAlert('Please select quantity', 'error');
                return;
            }

            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existing = cart.find(item => item.productId === productId);
            if (existing) {
                existing.quantity += quantity;
            } else {
                cart.push({
                    productId: product.id,
                    name: product.name,
                    price: product.price,
                    quantity: quantity
                });
            }

            qtyInput.textContent = 0;
            updateCartDisplay();
            showAlert(`Added ${quantity} x ${product.name} to cart`, 'success');
        }

        // Update cart display
        function updateCartDisplay() {
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="color: #a0aec0;">Cart is empty</p>';
                cartCount.textContent = '0 items';
                cartTotal.textContent = '₱0.00';
                checkoutBtn.disabled = true;
                return;
            }

            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            cartItems.innerHTML = cart.map((item, index) => `
                <div class="cart-item" data-cy="cart-item">
                    <span>${item.name} × ${item.quantity}</span>
                    <span>₱${((item.price * item.quantity) / 100).toFixed(2)}
                        <button onclick="removeFromCart(${index})" style="margin-left:10px;background:#fc8181;color:white;border:none;border-radius:4px;padding:2px 8px;cursor:pointer;">×</button>
                    </span>
                </div>
            `).join('');

            cartCount.textContent = `${totalItems} items`;
            cartTotal.textContent = `₱${(totalAmount / 100).toFixed(2)}`;
            checkoutBtn.disabled = false;
        }

        // Remove from cart
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartDisplay();
        }

        // Clear cart
        function clearCart() {
            cart = [];
            updateCartDisplay();
            showAlert('Cart cleared', 'success');
        }

        // Checkout
        async function checkout() {
            if (isProcessing) return;
            if (cart.length === 0) {
                showAlert('Cart is empty', 'error');
                return;
            }

            isProcessing = true;
            checkoutBtn.disabled = true;
            checkoutBtn.innerHTML = '<span class="loader"></span> Processing...';

            try {
                const items = cart.map(item => ({
                    productId: item.productId,
                    quantity: item.quantity
                }));

                const response = await fetch(`${ORDER_SERVICE_URL}/api/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        items: items,
                        customer: {
                            email: 'student@school.edu.ph'
                        }
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('Order created! Redirecting to payment...', 'success');
                    // Redirect to PayMongo checkout page
                    if (data.order.checkoutUrl) {
                        window.location.href = data.order.checkoutUrl;
                    } else {
                        showAlert('No checkout URL received', 'error', 'checkout-error');
                    }
                } else {
                    showAlert('Checkout failed: ' + data.error, 'error', 'checkout-error');
                }
            } catch (error) {
                showAlert('Checkout error: ' + error.message, 'error', 'checkout-error');
                console.error('Checkout error:', error);
            } finally {
                isProcessing = false;
                checkoutBtn.disabled = false;
                checkoutBtn.textContent = 'Proceed to Checkout';
            }
        }

        // Show alert
        function showAlert(message, type = 'success', cyName) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.setAttribute('data-cy', cyName || `alert-${type}`);
            alert.textContent = message;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);

            setTimeout(() => {
                if (alertContainer.contains(alert)) {
                    alert.remove();
                }
            }, 4000);
        }

        // ----- Login state (demo only: stored in the browser) -----
        function getSession() {
            try {
                return JSON.parse(sessionStorage.getItem('siai_session') || localStorage.getItem('siai_session'));
            } catch (e) {
                return null;
            }
        }

        function logout() {
            sessionStorage.removeItem('siai_session');
            localStorage.removeItem('siai_session');
            window.location.href = 'login.html'; // the shop needs a login, so go back to the login page
        }

        function makeLink(text, href, extraClass, cyName) {
            const a = document.createElement('a');
            a.href = href;
            a.textContent = text;
            a.className = 'auth-link ' + (extraClass || '');
            a.setAttribute('data-cy', cyName);
            return a;
        }

        function renderAuthBar() {
            const bar = document.getElementById('authBar');
            bar.innerHTML = '';
            const session = getSession();

            if (session) {
                const hello = document.createElement('span');
                hello.setAttribute('data-cy', 'auth-greeting');
                hello.textContent = 'Hi, ' + session.name; // textContent: never inject a name as HTML
                const btn = document.createElement('button');
                btn.className = 'auth-link';
                btn.textContent = 'Log out';
                btn.setAttribute('data-cy', 'logout-button');
                btn.onclick = logout;
                bar.appendChild(hello);
                bar.appendChild(btn);
            } else {
                bar.appendChild(makeLink('Log in', 'login.html', '', 'login-link'));
                bar.appendChild(makeLink('Sign up', 'signup.html', 'primary', 'signup-link'));
            }
        }

        // Initialize
        renderAuthBar();
        loadProducts();
    </script>
</body>
</html>
